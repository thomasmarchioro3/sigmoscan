[SCANNER]

INTERFACE=default
; NOTE: it's important that this directory is /tmp when the scanner is Dockerized to avoid permission issues
TEMP_PCAP_PATH=/tmp/pcap
ROTATE_EVERY_T_SEC=5

[KAFKA]

IP_CLIENT=172.42.0.11
ADDRESS_SERVER=http://127.0.0.1:9092
TOPIC=network
; PLAINTEXT, SASL_PLAINTEXT or SASL_SSL
SECURITY_PROTOCOL=SASL_PLAINTEXT
SASL_MECHANISM=PLAIN
SASL_PLAIN_USERNAME=admin
SASL_PLAIN_PASSWORD=admin

; The keys below are only used when SECURITY_PROTOCOL=SASL_SSL.
; Relative paths start from the folder of this file.
; SSL_CAFILE=certs/kafka-ca-1.crt
; SSL_CERTFILE=certs/<user>.certificate.pem
; SSL_KEYFILE=certs/<user>.key
; SSL_PASSWORD=<key password>
; SSL_CHECK_HOSTNAME=true
