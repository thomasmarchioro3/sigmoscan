[SCANNER]

INTERFACE=default
; NOTE: it's important that this directory is /tmp when the scanner is Dockerized to avoid permission issues
TEMP_PCAP_PATH=/tmp/pcap
ROTATE_EVERY_T_SEC=5

[KAFKA]

; The connection settings (address, topic, credentials, certificates) are in the .env file: see example.env

IP_CLIENT=172.42.0.11
; PLAINTEXT, SASL_PLAINTEXT or SASL_SSL
SECURITY_PROTOCOL=SASL_PLAINTEXT
SASL_MECHANISM=PLAIN

; Only used when SECURITY_PROTOCOL=SASL_SSL
; SSL_CHECK_HOSTNAME=true
