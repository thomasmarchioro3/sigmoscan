services:
  sigmoscan:
    build: .
    image: sigmoscan:latest
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cpus: 1.0
    env_file:
      # Kafka connection settings (see example.env)
      - path: .env
        required: false
    volumes:
      # Kafka certificates for SASL_SSL, read-only
      - ./certs:/app/certs:ro
    stdin_open: true
    tty: true
