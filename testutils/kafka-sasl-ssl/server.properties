# Single-node Kafka (KRaft) with a SASL_SSL listener for clients.
# TEST ONLY: all passwords in this file are public.

process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093
controller.listener.names=CONTROLLER

# EXTERNAL: for clients, SASL PLAIN over TLS with a client certificate (port published by Docker)
# INTERNAL: plaintext, only reachable from inside the container (healthcheck, Kafka CLI tools)
listeners=EXTERNAL://0.0.0.0:9092,INTERNAL://localhost:29092,CONTROLLER://localhost:9093
advertised.listeners=EXTERNAL://127.0.0.1:9092,INTERNAL://localhost:29092
listener.security.protocol.map=EXTERNAL:SASL_SSL,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL

# --- SASL PLAIN: user_<name>="<password>" defines one client user ---
sasl.enabled.mechanisms=PLAIN
listener.name.external.sasl.enabled.mechanisms=PLAIN
listener.name.external.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
    user_sigmoscan="sigmoscan-secret";

# --- TLS (files made by gen-certs.sh) ---
ssl.keystore.type=PKCS12
ssl.keystore.location=/opt/kafka/config/sasl-ssl/secrets/kafka.keystore.p12
ssl.keystore.password=broker-keystore-password
ssl.key.password=broker-keystore-password
ssl.truststore.type=PEM
ssl.truststore.location=/opt/kafka/config/sasl-ssl/secrets/kafka-ca-1.crt
# Clients must send a certificate signed by the test CA.
# For SASL_SSL listeners, Kafka ignores the broker-wide ssl.client.auth: it must have the listener prefix.
listener.name.external.ssl.client.auth=required

# --- Single node: replication factor 1 everywhere ---
num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=true

log.dirs=/tmp/kraft-combined-logs
